<script type="text/html" data-help-name="devicehub-from-device">
  <p>Receives messages sent by a device's <code>to cloud</code> endpoint under a
     matching topic.</p>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>topic <span class="property-type">string</span></dt>
    <dd>Exactly the topic the device sent under.</dd>
    <dt>payload <span class="property-type">any JSON</span></dt>
    <dd>Exactly what the device flow sent — objects, arrays, strings, numbers,
        booleans and <code>null</code> all arrive unchanged.</dd>
    <dt>timestamp <span class="property-type">string</span></dt>
    <dd>ISO 8601, stamped when the device sent it. Not the time it arrived.</dd>
  </dl>

  <h3>Topic matching</h3>
  <p>Exact by default. <code>*</code> receives every topic from this device, and
     a trailing <code>*</code> matches a prefix (<code>sensor/*</code>) — useful
     for a single debugging node.</p>

  <h3>Device</h3>
  <p>Use the device's <b>role</b> (<code>Freya-vivarium</code>), not its raw MQTT
     name. The raw name is reassigned whenever a device re-provisions; the role
     follows the device and survives a hardware swap.</p>
  <p>The field is free text and names are case-sensitive. If the hub has no
     device by that name the node shows <b>"unknown device"</b>.</p>

  <h3>Status</h3>
  <p>The badge reports the <i>device</i>, and is the same one the
     <code>device</code> node shows. Hub problems take over the badge, because
     while the hub is unreachable the device's state cannot be observed.</p>
  <ul>
    <li><b>Green dot "&lt;device&gt;: online"</b> - connected to the hub</li>
    <li><b>Red ring "&lt;device&gt;: offline"</b> - hub reachable, device is not connected</li>
    <li><b>Red ring "unknown device: &lt;device&gt;"</b> - no such device on this hub</li>
    <li><b>Grey ring "&lt;device&gt;: unknown"</b> - state not yet established</li>
    <li><b>Yellow ring "connecting to hub"</b> / <b>Red ring "hub unreachable"</b></li>
  </ul>

  <h3>Delivery</h3>
  <p>Best effort. Nothing is queued: a message sent while the hub or device is
     unreachable is lost, not delayed.</p>
</script>

<script type="text/html" data-help-name="devicehub-to-device">
  <p>Sends a message to a device, arriving at the device's <code>from cloud</code>
     endpoint configured with the same topic.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">any JSON</span></dt>
    <dd>Sent through unchanged. Must be JSON-serialisable — Buffers are not
        supported.</dd>
    <dt class="optional">timestamp <span class="property-type">string</span></dt>
    <dd>ISO 8601. Added automatically when absent, and never rewritten
        afterwards.</dd>
  </dl>

  <h3>Topic</h3>
  <p>Set on the node, not the message. This node is the endpoint, so its topic
     is authoritative: a message arriving with a different <code>msg.topic</code>
     is sent under the node's topic and a warning is logged. Wildcards are for
     receiving only.</p>

  <h3>Device</h3>
  <p>Use the device's <b>role</b>, not its raw MQTT name. The field is free text
     and names are case-sensitive; if the hub has no device by that name the node
     shows <b>"unknown device"</b> and every message sent is rejected with
     <code>Device not found</code>.</p>

  <h3>Status</h3>
  <p>The badge reports the <i>device</i>, and is the same one the
     <code>device</code> node shows — this direction only sends, but nothing
     queues, so an offline or misnamed device means the next message is dropped.</p>
  <ul>
    <li><b>Green dot "&lt;device&gt;: online"</b> - connected to the hub</li>
    <li><b>Red ring "&lt;device&gt;: offline"</b> - hub reachable, device is not connected</li>
    <li><b>Red ring "unknown device: &lt;device&gt;"</b> - no such device on this hub</li>
    <li><b>Grey ring "&lt;device&gt;: unknown"</b> - state not yet established</li>
    <li><b>Yellow ring "connecting to hub"</b> / <b>Red ring "hub unreachable"</b></li>
  </ul>

  <h3>Delivery</h3>
  <p>Best effort. If the device is offline the message is dropped, not queued —
     the node reports an error rather than failing silently.</p>
</script>
