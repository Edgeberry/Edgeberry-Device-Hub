name: Publish Node-RED Module

# Disabled from auto-running on release publish (was clobbering the
# devicehub-<tag>.tar.gz release asset - see release_node-red.yml history).
# Trigger manually from the Actions tab when a Node-RED release is needed.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Build and pack Node-RED module
        run: |
          mkdir -p dist-artifacts
          pushd examples/app-client/examples
          npm ci || npm install
          npm run build
          npm pack --pack-destination ../../../dist-artifacts
          popd

      - name: Publish Node-RED package to npm
        run: |
          pushd examples/app-client/examples
          # Version is already set by sync-versions.js script
          npm publish --provenance --access public
          popd
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
